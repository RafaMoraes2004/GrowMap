<div class="background-video">
  <video id="bg-video" autoplay muted loop playsinline preload="auto">
    <source src="assets/Auravideo.mp4" type="video/mp4">
    Seu navegador não suporta vídeos HTML5.
  </video>
</div>

<div class="login-container">

  <!-- Header -->
  <header class="header">
    <div class="logo">
      Grow<span class="highlight">Map</span>
    </div>

    <nav class="nav-menu">
      <a href="#">SOBRE</a>
      <a href="#">FEEDBACK</a>
      <a href="#">ORÇAMENTO</a>
      <a href="#">CONTATOS</a>
      <a href="#">PARCEIROS</a>
      <a href="#">HOME</a>
      <a href="#">LOGIN</a>
      <button class="btn-register active">Registrar-se</button>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="register-form">
      <h2>Cadastrar Empresa</h2>
      <br>
      <br>

      <form>
        <div class="form-columns">
          <!-- Bloco Esquerdo: Informações da Empresa -->
          <div class="form-column left">
            <div class="input-group">
              <input type="text" placeholder="Razão Social" />
              <span class="icon">🏢</span>
            </div>

            <div class="input-group">
              <input type="text" placeholder="CNPJ" />
              <span class="icon">🆔</span>
            </div>

            <div class="input-group">
              <input type="tel" placeholder="Telefone" />
              <span class="icon">📞</span>
            </div>

            <div class="input-group">
              <input type="email" placeholder="E-mail" />
              <span class="icon">✉️</span>
            </div>

            <div class="input-group">
              <input type="password" placeholder="Senha" />
              <span class="icon">🔒</span>
            </div>

            <div class="input-group">
              <input type="password" placeholder="Confirmar Senha" />
              <span class="icon">🔒</span>
            </div>
          </div>

          <!-- Bloco Direito: Endereço + Quantidade de Funcionários + Setor -->
          <div class="form-column right">
            <div class="input-group">
              <input type="text" placeholder="CEP" />
              <span class="icon">📍</span>
            </div>

            <div class="input-group">
              <input type="text" placeholder="Rua" />
              <span class="icon">🏠</span>
            </div>

            <div class="input-group">
              <input type="text" placeholder="Bairro" />
              <span class="icon">🏘️</span>
            </div>

            <div class="input-group">
              <input type="text" placeholder="Número" />
              <span class="icon">#️⃣</span>
            </div>

            <div class="input-group">
              <input type="number" placeholder="Quantidade de Funcionários" />
              <span class="icon">👥</span>
            </div>

            <div class="input-group">
              <input type="text" placeholder="Setor de Atuação" />
              <span class="icon">🏭</span>
            </div>
          </div>
        </div>
     <br>
     <br>
        <div class="terms">
          <label>
            <input type="checkbox" /> Aceito os Termos de Uso e a Política de Privacidade
          </label>
        </div>
     <br>
        <button type="button" class="btn-register-form">Cadastrar Empresa</button>
      </form>
    </div>
  </main>
</div>
